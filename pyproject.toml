[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walden-list"
version = "0.1.0"
description = "Reproducible, categorized domain lists for Walden"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elia Scotto" }]
dependencies = []

[project.scripts]
walden-list = "walden_list.cli:main"

[tool.setuptools.packages.find]
include = ["walden_list*"]

